# City-Scale Urban Flood Nowcasting Configuration

# Bounding box presets (min_lon, min_lat, max_lon, max_lat)
presets:
  pilot:
    description: "Dwarka Mor & Najafgarh Drain Basin"
    bbox: [77.0150, 28.5900, 77.0500, 28.6300]
    
  test_zone:
    description: "Palam Drain Catchment (Adjoining Najafgarh)"
    bbox: [77.0500, 28.5600, 77.1000, 28.6000]
    
  full_delhi:
    description: "All-Delhi NCR Region"
    bbox: [76.8300, 28.4000, 77.3400, 28.8800]

  ito:
    description: "ITO (Mathura Road Junction) Flood Hotspot"
    bbox: [77.2335, 28.6235, 77.2485, 28.6345]

  pragati_maidan:
    description: "Pragati Maidan Tunnel Flood Hotspot"
    bbox: [77.2390, 28.6110, 77.2500, 28.6210]

# Default execution zone
default_preset: "pilot"

# API Endpoints
endpoints:
  opentopo: "https://portal.opentopography.org/API/globaldem"
  overpass: "https://overpass-api.de/api/interpreter"
  datagov: "https://api.data.gov.in/resource"
  earthdata: "https://cmr.earthdata.nasa.gov/search/granules.json"
